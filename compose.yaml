services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ford_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ford_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d ford_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  ford_pg_data:
